version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ecom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom_net

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    volumes:
      - cache_data:/data
    networks:
      - ecom_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecom_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379

      ENCRYPT_KEY: ${ENCRYPT_KEY}
      SALT: ${SALT}

      JWT_SECRET_ACCESS_ADMIN: ${JWT_SECRET_ACCESS_ADMIN}
      JWT_SECRET_REFRESH_ADMIN: ${JWT_SECRET_REFRESH_ADMIN}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}

      APP_EMAIL: ${APP_EMAIL}
      APP_PASSWORD: ${APP_PASSWORD}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}

      CORS_ORIGINS: ${CORS_ORIGINS}
      IPGEO_API_KEY: ${IPGEO_API_KEY}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    ports:
      - "5000:5000"

    volumes:
      - ./uploads:/app/uploads
    networks:
      - ecom_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecom_pgadmin
    restart: unless-stopped
    ports:
      - "5055:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecom_net

networks:
  ecom_net:
    driver: bridge

volumes:
  db_data:
  cache_data:
  uploads_data:
